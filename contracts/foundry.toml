[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[lint]
lint_on_build = false
